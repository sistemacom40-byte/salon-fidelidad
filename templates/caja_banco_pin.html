<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, #e0d9c4, #b8c9a8);
      font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 14px;
    }
    .box { background: white; padding: 28px; border-radius: 16px; width: 320px; max-width: 100%; }
    input {
      width: 100%; padding: 12px; font-size: 16px;
      border: 1px solid #ccc; border-radius: 8px; margin: 10px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%; padding: 12px; background: #4a6d3f; color: white;
      border: none; border-radius: 8px; font-size: 16px;
    }
    .msg-error {
      background: #fbe4e4; color: #a33; padding: 10px; border-radius: 8px;
      text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 12px;
    }
    a.volver { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔒 Banco</h2>
    <p style="font-size:13px; color:#777;">Esta sección requiere el PIN especial de la dueña.</p>

    {% if error %}
      <p class="msg-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('caja_banco_verificar') }}">
      <input type="password" name="pin_duena" inputmode="numeric" maxlength="4" placeholder="PIN especial" required autofocus>
      <button type="submit">Entrar</button>
    </form>

    <a class="volver" href="{{ url_for('panel') }}">← Volver al panel</a>
  </div>
</body>
</html>
